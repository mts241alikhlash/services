name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      services: ${{ steps.affected.outputs.services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Configure GitHub Packages access
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/select-mode@v2
        id: select
      - name: Select affected services
        id: affected
        shell: bash
        run: |
          services="$(node .github/scripts/affected-services.mjs '${{ github.event.before }}' --release-json --json)"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Configure GitHub Packages access
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@v2
        with:
          version: pnpm run version
          pr-title: Release
          commit-message: Release
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Configure GitHub Packages access
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: changesets/action/publish@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          create-github-releases: true
          push-git-tags: true

  publish-images:
    needs:
      - select-mode
      - publish
    if: needs.select-mode.outputs.mode == 'publish' && needs.publish.result == 'success' && needs.select-mode.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select-mode.outputs.services) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read service version
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./services/${{ matrix.service }}/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.package.outputs.version }}
      - name: Record image digest
        run: |
          {
            echo "Service tag: ${{ matrix.service }}@${{ steps.package.outputs.version }}"
            echo "Service image: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}@${{ steps.image.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
